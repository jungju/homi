name: QA Harness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install doc tooling
        run: pnpm install --frozen-lockfile

      - name: Go tests
        run: go test ./...

      - name: Contract validation
        run: pnpm run qa:contract

      - name: Upload generated contract reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-contract-artifacts
          if-no-files-found: warn
          path: |
            docs/machine/coverage.v1.yaml
            docs/machine/dependency-graph.v1.yaml
