  "generated": false,
  "updated": "2026-03-13",
  "rules": [
    {
      "id": "ui.home.face_visible",
      "statement": "홈(/)에서 home-face는 항상 표시된다."
    },
    {
      "id": "ui.home.bubble_visible",
      "statement": "홈(/)에서 home-bubble이 표시된다."
    },
    {
      "id": "ui.home.mode_text_visible",
      "statement": "home-mode-text는 받아쓰기 실행모드에서만 텍스트로 표시되며 icon-only 표현은 허용하지 않는다."
    },
    {
      "id": "ui.home.default_text_minimal",
      "statement": "기본 모드에서 active alert/error/quiet mode가 없으면 home-status-text와 home-mode-text를 렌더하지 않는다."
    },
    {
      "id": "ui.home.quiet_mode_text_visible",
      "statement": "기본 모드에서 quiet mode가 활성화되면 home-status-text에 quiet mode 진행 상태 문구가 표시된다."
    },
    {
      "id": "ui.home.control_grid_3x3",
      "statement": "홈 얼굴 화면은 home-area-grid 기반 3x3(총 9개) named area(home-area-1..9)로 구성된다."
    },
    {
      "id": "ui.home.control_box_2.bubble",
      "statement": "기본 모드/실행 모드 공통으로 home-bubble은 area-2를 기준 anchor로 삼되, 실제 배치는 상단 span area-1..3 위에서 시작할 수 있다."
    },
    {
      "id": "ui.home.control_box_6.clock",
      "statement": "홈(/)의 home-clock은 area-6을 기준 anchor로 삼되, 실제 배치는 area-5..6 span 위에서 시작할 수 있고, 카드형 박스 없이 home-clock-date/home-clock-time 텍스트만으로 날짜·요일·시:분을 매우 큰 글자로 보여준다."
    },
    {
      "id": "ui.home.control_box_6.clock_content_contained",
      "statement": "home-clock의 날짜/시간 텍스트는 항상 home-clock 텍스트 영역 내부에 완전히 들어가야 하며, 이 영역이 area-6 기준으로 인접 area를 침범하더라도 viewport 밖으로 나가면 안 된다."
    },
    {
      "id": "ui.home.zone_bounds_soft",
      "statement": "home-area-grid의 9개 구역은 named anchor 영역이며, 콘텐츠는 필요 시 인접 area를 span하거나 침범할 수 있다. 특히 home-bubble은 area-2를 기준으로 area-1..3 상단 span까지 수평 확장이 가능하다."
    },
    {
      "id": "ui.home.robot_name_prominent",
      "statement": "기본 모드의 home-bubble 상단에는 로봇 이름 '호미'(home-robot-name)가 크게 표시된다."
    },
    {
      "id": "ui.home.face_large_tablet",
      "statement": "home-face는 태블릿 원거리 가시성을 위해 크게 렌더링되어야 하며, 기본 홈 viewport 기준 기존 대비 약 2배 체감 크기를 목표로 한다."
    },
    {
      "id": "ui.home.eyes_prominent",
      "statement": "home-face의 눈(home-face__eye)은 멀리서도 표정이 읽히도록 크게 렌더링되어야 하며, 기본 홈 viewport 기준 현재 기준선 대비 약 2배 크기를 목표로 한다."
    },
    {
      "id": "ui.home.alert_text_under_robot_name",
      "statement": "기본 모드에서 알림 또는 주요 상태 문구(home-status-text)는 로봇 이름 아래에 큰 텍스트로 표시된다. schedule 정기 알림은 요약문이 아니라 항목 title만 표시한다."
    },
    {
      "id": "ui.typography.tablet_large_text",
      "statement": "태블릿 원거리 사용을 위해 홈 핵심 텍스트와 주요 버튼은 큰 글자 크기를 유지한다."
    },
    {
      "id": "ui.home.control_box_8.idle_controls",
      "statement": "기본 모드의 엔진 진입 컨트롤(home-open-engines)은 area-8을 기준 anchor로 삼아 하단 중앙 영역에서 시작한다."
    },
    {
      "id": "ui.home.control_box_9.settings",
      "statement": "home-open-backup은 홈 얼굴 화면의 area-9(우하단)을 기준 anchor로 삼아 배치되고 설정 아이콘만 표시한다."
    },
    {
      "id": "ui.home.control_box_8.dictation_runner",
      "statement": "받아쓰기 실행 모드 컨트롤(dictation-root)은 area-8을 기준 anchor로 삼아 하단 중앙 영역에서 시작한다."
    },
    {
      "id": "ui.home.no_page_scroll",
      "statement": "홈 얼굴 화면(route=/)은 모드와 무관하게 문서 스크롤 없이 viewport 안에서 레이아웃이 완결된다."
    },
    {
      "id": "ui.home.face_position_stable_across_modes",
      "statement": "기본 모드와 받아쓰기 실행모드 전환 시 home-face의 위치는 변하지 않는다."
    },
    {
      "id": "ui.home.no_global_header",
      "statement": "global header/nav/testid(global-header, global-nav, top-navbar)는 금지한다."
    },
    {
      "id": "ui.home.no_toast_surface",
      "statement": "홈 얼굴 화면(route=/)에서는 toast-root와 schedule-toast를 렌더하지 않는다."
    },
    {
      "id": "ui.overlay.engine_contract",
      "statement": "engine route는 overlay-root(data-overlay-kind=engine) 계약을 만족한다."
    },
    {
      "id": "ui.overlay.backup_contract",
      "statement": "브레인 설정 route(/brain)는 overlay-root(data-overlay-kind=backup) 계약을 만족한다."
    },
    {
      "id": "ui.backup.no_full_export_action",
      "statement": "브레인 설정 overlay에는 전체 export 버튼(backup-export-btn)을 두지 않는다."
    },
    {
      "id": "ui.backup.import_tabs",
      "statement": "브레인 설정 overlay의 가져오기 방식은 backup-tablist 아래 4개 탭(backup-tab-url, backup-tab-text, backup-tab-file, backup-tab-sample)으로 제공되며, 순서는 URL 가져오기 → 텍스트로 가져오기 → 파일로 가져오기 → 샘플 가져오기다."
    },
    {
      "id": "ui.backup.single_active_panel",
      "statement": "브레인 설정 overlay에서는 한 번에 하나의 가져오기 패널만 활성화되며, backup-panel-url/text/file/sample 중 현재 선택된 탭의 패널만 보인다."
    },
    {
      "id": "ui.backup.schedule_quiet_controls",
      "statement": "브레인 설정 overlay에는 30분 조용히 시작/해제 버튼과 현재 상태 문구(backup-quiet-enable, backup-quiet-clear, backup-quiet-status)가 표시된다."
    },
    {
      "id": "ui.backup.url_sync_status",
      "statement": "브레인 설정 overlay의 URL 가져오기 패널에는 backup-url-sync-status가 표시되어 현재 URL 자동 업데이트 연결 여부와 마지막 저장 URL 유지 상태를 보여준다."
    },
    {
      "id": "ui.backup.version_date_visible",
      "statement": "브레인 설정 overlay에는 backup-version이 표시되고, 배포 버전을 YYYY-MM-DD 날짜 형식으로 보여준다."
    },
    {
      "id": "ui.backup.theme_controls",
      "statement": "브레인 설정 overlay에는 현재 테마 문구(backup-theme-status)와 라이트/다크 모드 전환 버튼(backup-theme-light, backup-theme-dark)이 표시된다."
    },
    {
      "id": "ui.backup.debug_control_box_controls",
      "statement": "브레인 설정 overlay에는 홈 9분할 디버그 오버레이 상태 문구(backup-debug-areas-status)와 Show/Hidden(none) 전환 버튼(backup-debug-areas-show, backup-debug-areas-hide)이 표시된다."
    },
    {
      "id": "ui.home.debug_control_boxes_overlay",
      "statement": "디버그 오버레이가 켜지면 home-area-grid는 data-debug-areas=visible 상태가 되고, home-area-1..9는 각기 다른 반투명 색으로 표시된다. 각 구역 좌상단에는 별도 상위 레이어 라벨(home-area-{n}-label)이 작은 글씨로 표시되어 정확한 area 식별자를 보여준다. 꺼지면 data-debug-areas=hidden 이어야 한다."
    },
    {
      "id": "ui.debug.layer.page_and_popup_labels",
      "statement": "디버그 모드가 켜지면 독립 레이어(debug-layer-root)에 현재 page 이름(debug-page-name)과 현재 popup 제목(debug-popup-name)이 표시된다. popup이 없으면 popup 제목은 생략될 수 있다."
    },
    {
      "id": "ui.debug.layer.control_labels",
      "statement": "디버그 모드가 켜지면 독립 레이어에서 주요 section anchor를 debug-section-label로 표시하고, 각 라벨은 data-debug-target-kind=section 및 data-debug-target-id 속성으로 어떤 section인지 식별한다."
    },
    {
      "id": "ui.engine.no_backup_import_controls",
      "statement": "engine overlay에서 브레인 설정 import 입력 testid는 존재하면 안 된다."
    },
    {
      "id": "ui.engine.no_top_dataset_add_action",
      "statement": "모든 engine 설정 overlay 상단에 전역 '새 자료 세트' 버튼을 두지 않는다."
    },
    {
      "id": "ui.schedule.preview_list_in_engine",
      "statement": "schedule engine overlay에는 schedule-preview-list와 schedule-preview-status가 표시되고, 각 schedule-preview-item을 눌러 등록된 schedule 항목 음성을 미리 들을 수 있다."
    },
    {
      "id": "ui.schedule.preview_meta_shows_recurrence",
      "statement": "schedule-preview-item의 보조 문구는 raw date가 아니라 매일/매년 반복 의미와 시간 정보를 사람이 읽을 수 있는 형식으로 보여준다."
    },
    {
      "id": "ui.schedule.hourly_chime_controls",
      "statement": "schedule engine overlay에는 정시 차임 On/Off 버튼(schedule-hourly-chime-toggle)과 현재 상태 문구(schedule-hourly-chime-status)가 표시된다."
    },
    {
      "id": "ui.dataset_row.required",
      "statement": "dataset-row는 data-engine-id/data-dataset-id/data-dataset-title를 가진다."
    },
    {
      "id": "ui.dictation.runner_contract",
      "statement": "dictation 실행 상태 UI는 홈(/)에서 표시되고 progress/next/exit 계약을 유지한다."
    },
    {
      "id": "ui.dictation.runner_home_surface",
      "statement": "dictation 시작 후 engine overlay는 닫히고 홈 얼굴 화면에서 실행 UI(dictation-root)가 노출된다."
    }
  ],
