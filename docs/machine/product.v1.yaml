{
  "id": "homi.machine.product.v1",
  "version": "v1",
  "documentType": "product",
  "schemaRef": "schemas/machine/product.v1.schema.json",
  "authoritative": true,
  "generated": false,
  "updated": "2026-05-31",
  "rules": [
    {
      "id": "product.runtime.go_server",
      "statement": "Homi는 Go 웹서버가 HTML 템플릿과 정적 자산을 제공하는 서버 앱이다."
    },
    {
      "id": "product.auth.ohmesh_login_required",
      "statement": "Homi 클라이언트는 시작 시 Ohmesh /auth/me optional check를 수행하고 세션이 없으면 Ohmesh login URL로 이동한다."
    },
    {
      "id": "product.storage.ohmesh_records",
      "statement": "영속 데이터는 Ohmesh Records API를 credentials include 방식으로 호출해 사용자와 app slug 범위 안에 저장한다."
    },
    {
      "id": "product.storage.dataset_record_per_dataset",
      "statement": "각 Homi dataset은 Ohmesh record type homi.dataset.v1 한 개로 저장한다."
    },
    {
      "id": "product.storage.ui_single_record",
      "statement": "테마, 로봇 스타일, 조용히 모드, URL 연결 상태는 Ohmesh record type homi.ui.v1의 최신 record에 저장한다."
    },
    {
      "id": "product.import.bundle_level_only",
      "statement": "Import/Export는 항상 HomiBundleV1 번들 단위로 처리한다."
    },
    {
      "id": "product.import.entry_route.backup_only",
      "statement": "Import 입력(URL/텍스트/파일/샘플)은 브레인 설정 route(/brain)에서만 허용한다."
    },
    {
      "id": "product.import.preview_required",
      "statement": "Import는 Go 서버의 bundle preview 검증을 거치고 사용자 확정 시에만 Ohmesh record에 저장한다."
    },
    {
      "id": "product.import.apply_mode.replace",
      "statement": "Import 적용 모드는 v1에서 replace(기존 dataset records 삭제 후 신규 records 생성)만 허용한다."
    },
    {
      "id": "product.import.collision_dataset_id_regenerate",
      "statement": "Import 중 dataset id 충돌 시 v1 정책으로 새 id를 생성해 추가 처리한다."
    },
    {
      "id": "product.dictation.mode_text.required",
      "statement": "받아쓰기 실행 중 앱 모드는 홈 말풍선에 텍스트로 표시한다."
    },
    {
      "id": "product.dictation.auto_advance_10s",
      "statement": "받아쓰기는 10초 간격 자동 진행을 기본 규칙으로 유지한다."
    },
    {
      "id": "product.schedule.no_os_notification_during_dictation",
      "statement": "받아쓰기 실행 중 schedule 알림은 OS notification이나 홈 toast로 인터럽트하지 않는다."
    },
    {
      "id": "product.schedule.quiet_mode_30m_suppresses_reminders",
      "statement": "브레인 설정의 30분 조용히 모드가 켜져 있으면 schedule reminder와 chime을 억제한다."
    },
    {
      "id": "product.security.block_javascript_scheme",
      "statement": "URL Import에서 javascript: 스킴을 차단한다."
    },
    {
      "id": "product.security.render_text_only",
      "statement": "외부 입력 데이터는 HTML 파싱 없이 텍스트 또는 JSON 값으로만 렌더링한다."
    }
  ],
  "routes": [
    {
      "id": "route.home",
      "path": "/",
      "routeType": "page",
      "overlay": false,
      "purpose": "home face screen"
    },
    {
      "id": "route.engine",
      "path": "/engines/{engineId}",
      "routeType": "overlay",
      "overlay": true,
      "purpose": "engine dataset management and run setup"
    },
    {
      "id": "route.backup",
      "path": "/brain",
      "routeType": "overlay",
      "overlay": true,
      "purpose": "brain settings with import and Ohmesh-backed settings"
    }
  ],
  "storage": {
    "backend": "ohmesh-records",
    "key": "ohmesh:homi",
    "storeType": "HomiStoreV1",
    "schemaRef": "schemas/domain/store.v1.schema.json",
    "loadFunction": "loadStoreFromOhmeshRecords",
    "saveFunction": "saveRecordsToOhmesh",
    "ohmeshBaseURLDefault": "https://ohmesh.jjgo.io",
    "appSlugDefault": "homi",
    "datasetRecordType": "homi.dataset.v1",
    "uiRecordType": "homi.ui.v1",
    "recordOwnership": "ohmesh_app_user",
    "recordShape": "dataset_per_record"
  },
  "modes": [
    {
      "id": "mode.idle",
      "label": "기본 모드"
    },
    {
      "id": "mode.dictation_running",
      "label": "받아쓰기 실행모드"
    }
  ],
  "engines": [
    {
      "id": "schedule",
      "schemaVersion": 1,
      "schemaRef": "schemas/domain/engines/schedule.item.v1.schema.json"
    },
    {
      "id": "dictation",
      "schemaVersion": 1,
      "schemaRef": "schemas/domain/engines/dictation.item.v1.schema.json"
    }
  ],
  "importExportPolicy": {
    "entryRoute": "/brain",
    "allowedImportMethods": [
      "url",
      "text",
      "file",
      "sample"
    ],
    "bundleSchemaRef": "schemas/domain/homi-bundle.v1.schema.json",
    "previewBeforeConfirm": true,
    "applyMode": "replace",
    "datasetIdConflictPolicy": "regenerate",
    "limits": {
      "maxBundleBytes": 2097152,
      "maxDatasetsPerBundle": 50,
      "maxItemsPerDataset": 10000,
      "maxStringLength": 10000
    }
  },
  "notificationPolicy": {
    "dictationRunning": {
      "osNotificationAllowed": false,
      "fallbackChannel": "none"
    },
    "quietMode": {
      "durationMinutes": 30,
      "suppressChannels": [
        "reminder_alert_text",
        "os_notification",
        "speech"
      ]
    },
    "default": {
      "osNotificationAllowed": true,
      "fallbackChannel": "home_status"
    }
  },
  "securityPolicy": {
    "dangerousSchemes": [
      "javascript:"
    ],
    "allowedUrlSchemes": [
      "https:",
      "http://localhost"
    ],
    "allowLocalhostHttp": true,
    "renderTextOnly": true,
    "externalFetchWarning": true,
    "corsFailureMessageRequired": true
  },
  "sampleBundlePolicy": {
    "path": "public/samples/homi.sample.homi.json",
    "schemaRef": "schemas/domain/homi-bundle.v1.schema.json",
    "flow": "preview_then_confirm"
  },
  "sourceTypeEnum": [
    "manual",
    "sample",
    "url",
    "file",
    "text"
  ]
}
