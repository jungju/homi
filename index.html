<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Homi</title>
    <link rel="icon" href="/favicon.svg">
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <script>
      window.HOMI_CONFIG = {
        ohmeshBaseUrl: "https://ohmesh.jjgo.io",
        ohmeshAppSlug: "homi",
        redirectUrl: window.location.origin + "/",
        recordTypes: {
          dataset: "homi.dataset.v1",
          ui: "homi.ui.v1"
        }
      };
    </script>

    <main class="intro-page" data-page-panel="intro" data-testid="intro-root" hidden>
      <section class="intro-copy" aria-labelledby="intro-title">
        <p class="intro-kicker">homi</p>
        <h1 id="intro-title">Homi</h1>
        <p class="intro-lead">집 안에 상시 띄워두는 얼굴 화면.</p>
        <div class="intro-actions">
          <button type="button" data-action="login-face" data-testid="intro-login">로그인하고 시작</button>
          <button type="button" data-action="open-face" data-testid="intro-open-face" hidden>페이스 페이지 열기</button>
        </div>
        <p class="intro-status" data-testid="intro-status">Ohmesh 세션 확인 중</p>
      </section>
      <section class="intro-strip" aria-label="Homi core features">
        <span>음성 알림</span>
        <span>받아쓰기</span>
        <span>Ohmesh 저장</span>
      </section>
    </main>

    <main class="login-page" data-page-panel="login" data-testid="login-required-root" hidden>
      <section class="login-copy" aria-labelledby="login-title">
        <p class="login-kicker">homi</p>
        <h1 id="login-title">로그인이 필요합니다</h1>
        <p class="login-lead">페이스 페이지는 Ohmesh 세션이 확인된 뒤 열립니다.</p>
        <div class="login-actions">
          <button type="button" data-action="login-current" data-testid="login-required-login">로그인</button>
          <a class="secondary-link" href="/" data-testid="login-required-intro">소개로</a>
        </div>
        <p class="login-status" data-testid="login-required-status"></p>
      </section>
    </main>

    <div class="layout home-layout" data-page-panel="app" data-testid="app-root" hidden>
      <main class="home" data-testid="home-root">
        <section class="home-fullscreen">
          <div class="home-face" data-testid="home-face" data-face-root data-face-mood="idle" role="img" aria-label="친근한 홈 캐릭터 얼굴">
            <div class="home-face__frame" data-face-frame data-style="classic">
              <div class="home-face__head" data-face-head data-style="classic">
                <div class="home-face__shine"></div>
                <div class="home-face__eyes">
                  <span class="home-face__eye home-face__eye--left"><span class="home-face__eye-image"></span></span>
                  <span class="home-face__eye home-face__eye--right"><span class="home-face__eye-image"></span></span>
                </div>
                <div class="home-face__mouth"><span class="home-face__mouth-image"></span></div>
                <div class="home-face__cheek home-face__cheek--left"></div>
                <div class="home-face__cheek home-face__cheek--right"></div>
              </div>
            </div>
          </div>

          <div class="home-area-grid" data-testid="home-area-grid" data-debug-areas="hidden">
            <div class="home-area" data-area="1" data-testid="home-area-1"></div>
            <div class="home-area" data-area="2" data-testid="home-area-2"></div>
            <div class="home-area" data-area="3" data-testid="home-area-3"></div>
            <div class="home-area" data-area="4" data-testid="home-area-4"></div>
            <div class="home-area" data-area="5" data-testid="home-area-5"></div>
            <div class="home-area" data-area="6" data-testid="home-area-6"></div>
            <div class="home-area" data-area="7" data-testid="home-area-7"></div>
            <div class="home-area" data-area="8" data-testid="home-area-8"></div>
            <div class="home-area" data-area="9" data-testid="home-area-9"></div>
          </div>

          <div class="home-bubble" data-testid="home-bubble">
            <strong class="home-robot-name" data-testid="home-robot-name">호미</strong>
            <p class="home-mode-text" data-testid="home-mode-text" hidden></p>
            <p class="home-status-text" data-testid="home-status-text" hidden></p>
          </div>

          <div class="home-clock" data-testid="home-clock">
            <time class="home-clock-date" data-testid="home-clock-date"></time>
            <time class="home-clock-time" data-testid="home-clock-time"></time>
          </div>

          <div class="home-controls" data-testid="home-open-engines">
            <a class="engine-button" data-testid="home-engine-btn-schedule" href="/engines/schedule">스케줄</a>
            <a class="engine-button" data-testid="home-engine-btn-dictation" href="/engines/dictation">받아쓰기</a>
          </div>

          <a class="settings-button" data-testid="home-open-backup" aria-label="상시 화면 관리" href="/face/manage">⚙</a>
        </section>
      </main>

      <section class="overlay" data-testid="overlay-root" data-overlay="brain" data-overlay-kind="backup" hidden>
        <div class="overlay__bar">
          <h1 data-testid="overlay-title">상시 화면 관리</h1>
          <a class="icon-button" data-testid="overlay-close" aria-label="닫기" href="/face">×</a>
        </div>
        <div class="overlay__body brain-grid">
          <section class="tool-panel">
            <h2>Ohmesh</h2>
            <p data-testid="auth-status" class="muted">확인 중</p>
            <div class="row-actions">
              <button type="button" data-action="logout">로그아웃</button>
            </div>
          </section>

          <section class="tool-panel">
            <h2>가져오기</h2>
            <div class="tabs" role="tablist" data-testid="backup-tablist">
              <button type="button" data-tab="url" data-testid="backup-tab-url">URL 가져오기</button>
              <button type="button" data-tab="text" data-testid="backup-tab-text">텍스트로 가져오기</button>
              <button type="button" data-tab="file" data-testid="backup-tab-file">파일로 가져오기</button>
              <button type="button" data-tab="sample" data-testid="backup-tab-sample">샘플 가져오기</button>
            </div>
            <div class="tab-panel" data-panel="url" data-testid="backup-panel-url">
              <p data-testid="backup-url-sync-status" class="muted"></p>
              <input data-testid="backup-url-input" type="url" placeholder="https://example.com/homi.json">
              <button type="button" data-action="preview-url">미리보기</button>
            </div>
            <div class="tab-panel" data-panel="text" data-testid="backup-panel-text" hidden>
              <textarea data-testid="backup-text-input" rows="8" spellcheck="false"></textarea>
              <button type="button" data-action="preview-text">미리보기</button>
            </div>
            <div class="tab-panel" data-panel="file" data-testid="backup-panel-file" hidden>
              <input data-testid="backup-file-input" type="file" accept="application/json,.json">
              <button type="button" data-action="preview-file">미리보기</button>
            </div>
            <div class="tab-panel" data-panel="sample" data-testid="backup-panel-sample" hidden>
              <button type="button" data-testid="backup-sample-load" data-action="preview-sample">샘플 불러오기</button>
            </div>
            <div class="preview" data-testid="backup-preview" hidden></div>
            <div class="row-actions">
              <button type="button" data-testid="backup-confirm" data-action="confirm-import" disabled>적용</button>
              <button type="button" data-action="cancel-import">취소</button>
            </div>
          </section>

          <section class="tool-panel">
            <h2>상태</h2>
            <p data-testid="backup-quiet-status" class="muted"></p>
            <div class="row-actions">
              <button type="button" data-testid="backup-quiet-enable" data-action="quiet-enable">30분 조용히</button>
              <button type="button" data-testid="backup-quiet-clear" data-action="quiet-clear">해제</button>
            </div>
            <p data-testid="backup-theme-status" class="muted"></p>
            <div class="row-actions">
              <button type="button" data-testid="backup-theme-light" data-action="theme-light">Light</button>
              <button type="button" data-testid="backup-theme-dark" data-action="theme-dark">Dark</button>
            </div>
            <p data-testid="backup-robot-style-status" class="muted"></p>
            <div class="row-actions">
              <button type="button" data-testid="backup-robot-style-classic" data-action="robot-classic">Classic</button>
              <button type="button" data-testid="backup-robot-style-mint" data-action="robot-mint">Mint</button>
              <button type="button" data-testid="backup-robot-style-midnight" data-action="robot-midnight">Midnight</button>
            </div>
          </section>
        </div>
      </section>

      <section class="overlay" data-testid="overlay-root" data-overlay="engine" data-overlay-kind="engine" hidden>
        <div class="overlay__bar">
          <h1 data-testid="overlay-title" data-engine-title>설정</h1>
          <a class="icon-button" data-testid="overlay-close" aria-label="닫기" href="/face">×</a>
        </div>
        <div class="overlay__body engine-grid">
          <section class="tool-panel">
            <div class="engine-head">
              <h2 data-engine-title>설정</h2>
              <p data-testid="engine-status" class="muted"></p>
            </div>
            <div class="dataset-list" data-testid="dataset-list"></div>
          </section>

          <section class="tool-panel">
            <h2>자료 세트</h2>
            <input data-testid="dataset-title-input" type="text" placeholder="자료 세트 제목">
            <label class="check-row">
              <input data-testid="schedule-enabled-toggle" type="checkbox" checked>
              <span>Enabled</span>
            </label>
            <textarea data-testid="dataset-items-input" rows="12" spellcheck="false"></textarea>
            <div class="row-actions">
              <button type="button" data-action="save-dataset">저장</button>
              <button type="button" data-action="new-dataset">새로 작성</button>
              <button type="button" data-action="delete-dataset">삭제</button>
            </div>
          </section>

          <section class="tool-panel" data-engine-panel="schedule">
            <h2>미리 듣기</h2>
            <p data-testid="schedule-hourly-chime-status" class="muted"></p>
            <button type="button" data-testid="schedule-hourly-chime-toggle" data-action="toggle-chime">정시 차임</button>
            <p data-testid="schedule-preview-status" class="muted"></p>
            <div data-testid="schedule-preview-list" class="preview-list"></div>
          </section>

          <section class="tool-panel" data-engine-panel="dictation" hidden>
            <h2>실행</h2>
            <button type="button" data-action="start-dictation">시작</button>
            <div data-testid="dictation-root" class="dictation-runner" hidden>
              <p data-testid="dictation-progress"></p>
              <p data-testid="dictation-word"></p>
              <p data-testid="dictation-meaning"></p>
              <div class="row-actions">
                <button type="button" data-testid="dictation-next" data-action="dictation-next">다음</button>
                <button type="button" data-testid="dictation-exit" data-action="dictation-exit">종료</button>
              </div>
            </div>
          </section>
        </div>
      </section>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
